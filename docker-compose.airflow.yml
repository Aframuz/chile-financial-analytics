# Airflow (LocalExecutor) for the Chile financial analytics pipeline.
#
#   echo "AIRFLOW_UID=$(id -u)" >> .env
#   docker compose -f docker-compose.airflow.yml up -d --build
#   UI: http://localhost:8080  (airflow / airflow)
#
# The project code is mounted at /opt/airflow/project. src/ uses relative
# paths (config/, metadata/, data/), so tasks must run with that as cwd.

x-airflow-common:
  &airflow-common
  build:
    context: ./airflow
    # Build containers use the default bridge (MTU 1500), which stalls TLS on this host.
    network: host
  image: chile-financial-airflow:latest
  env_file:
    - .env
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY:-}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-airflow_jwt_secret}
    AIRFLOW__API_AUTH__JWT_ISSUER: ${AIRFLOW__API_AUTH__JWT_ISSUER:-airflow}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW_CONFIG: '/opt/airflow/config/airflow.cfg'
    DD_TRACE_ENABLED: 'false'
    # Task logs: also shipped to GCS when each task try ends, so they
    # outlive this machine (local copies stay in airflow/logs).
    AIRFLOW__LOGGING__REMOTE_LOGGING: 'true'
    AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER: gs://${GCS_RAW_BUCKET}/airflow-logs
    AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID: google_cloud_default
    # No keyfile: the Google provider falls back to Application Default
    # Credentials (GOOGLE_APPLICATION_CREDENTIALS below).
    AIRFLOW_CONN_GOOGLE_CLOUD_DEFAULT: '{"conn_type": "google_cloud_platform", "extra": {"project": "${GCP_PROJECT_ID}"}}'
    # Metrics: Airflow's own (DAG/task durations, failures) plus the
    # pipeline's (bcch.*, emitted by the report task) over StatsD.
    # statsd-exporter serves them in Prometheus format on :9102/metrics.
    AIRFLOW__METRICS__STATSD_ON: 'true'
    AIRFLOW__METRICS__STATSD_HOST: statsd-exporter
    AIRFLOW__METRICS__STATSD_PORT: '9125'
    AIRFLOW__METRICS__STATSD_PREFIX: airflow
    # Project code
    PROJECT_DIR: /opt/airflow/project
    PYTHONPATH: /opt/airflow/project
    # GCP: reuse host Application Default Credentials (gcloud auth application-default login)
    GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/gcloud/application_default_credentials.json
    GOOGLE_CLOUD_PROJECT: ${GCP_PROJECT_ID:-}
    # dbt
    DBT_BIN: /opt/airflow/dbt_venv/bin/dbt
    DBT_PROJECT_DIR: /opt/airflow/project/dbt/chile_financial_analytics
    DBT_PROFILES_DIR: /opt/airflow/dbt_profiles
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/config:/opt/airflow/config
    - ./airflow/plugins:/opt/airflow/plugins
    - ./src:/opt/airflow/project/src
    - ./config:/opt/airflow/project/config
    - ./metadata:/opt/airflow/project/metadata
    - ./data:/opt/airflow/project/data
    - ./dbt:/opt/airflow/project/dbt
    # Only the ADC file, not the whole gcloud dir (other accounts, token caches).
    - ${HOME}/.config/gcloud/application_default_credentials.json:/opt/airflow/gcloud/application_default_credentials.json:ro
    - ${HOME}/.dbt:/opt/airflow/dbt_profiles:ro
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  statsd-exporter:
    image: prom/statsd-exporter:v0.31.0
    ports:
      - "9102:9102"
    restart: always

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        if [[ -z "${AIRFLOW_UID}" ]]; then
          echo -e "\033[1;33mWARNING: AIRFLOW_UID not set. Add AIRFLOW_UID=$$(id -u) to .env\e[0m"
        fi
        mkdir -p /opt/airflow/{logs,dags,plugins,config} /opt/airflow/project/data
        /entrypoint airflow version
        /entrypoint airflow config list >/dev/null
        # Serializes BCCh tasks that touch raw_bcch (see airflow/dags/bcch_common.py)
        /entrypoint airflow pools set bcch_bigquery 1 "One BCCh BigQuery task at a time"
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/{logs,dags,plugins,config}
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
    user: "0:0"

  airflow-cli:
    <<: *airflow-common
    profiles:
      - debug
    environment:
      <<: *airflow-common-env
      CONNECTION_CHECK_MAX_COUNT: "0"
    command:
      - bash
      - -c
      - airflow

volumes:
  postgres-db-volume:

networks:
  default:
    driver_opts:
      # Host egress (eth2) has MTU 1300; bridge default of 1500 stalls TLS handshakes.
      com.docker.network.driver.mtu: ${DOCKER_NETWORK_MTU:-1300}
