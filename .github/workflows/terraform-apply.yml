name: Terraform apply

# Applies merged infrastructure changes, gated by risk
# (scripts/ci/tf_plan_risk.py):
#
#   none  nothing to apply
#   low   additive/cosmetic only -> `infra-auto` environment, applied
#         without waiting
#   high  deletes, replacements, IAM, identity, anything unknown ->
#         `infra-approval` environment, waits for a required reviewer
#
# Both environments accept main only, and gha-terraform trusts nothing
# else: the low-risk path can't be reached from a branch.
on:
  push:
    branches: [main]
    paths:
      - terraform/**
      # Read by terraform/composer.tf (Airflow pin, PyPI packages)
      - airflow/Dockerfile
      - airflow/requirements.txt
      - scripts/ci/tf_plan_risk.py
      - .github/actions/setup-terraform/**
      - .github/workflows/terraform-apply.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Queue applies; cancelling one mid-apply would leave state locked
concurrency:
  group: terraform-apply
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
  TF_VAR_operator_email: ${{ vars.TF_OPERATOR_EMAIL }}
  TF_VAR_github_repository: ${{ github.repository }}
  TF_VAR_github_repository_id: ${{ github.repository_id }}
  TF_VAR_github_repository_owner_id: ${{ github.repository_owner_id }}

jobs:
  # Read-only, as gha-ci: deciding the risk needs no write access
  plan:
    name: Plan and assess risk
    if: vars.GCP_TERRAFORM_SERVICE_ACCOUNT != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      risk: ${{ steps.risk.outputs.risk }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-terraform
        with:
          workload-identity-provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service-account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}

      - name: terraform plan
        working-directory: terraform
        run: |
          terraform plan -lock=false -no-color -out=plan.tfplan
          terraform show -json plan.tfplan > plan.json

      - name: Assess risk
        id: risk
        run: python3 scripts/ci/tf_plan_risk.py terraform/plan.json | tee -a "$GITHUB_STEP_SUMMARY"

      # The exact plan that was assessed is the one applied
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.risk.outputs.risk != 'none'
        with:
          name: tfplan
          path: terraform/plan.tfplan
          retention-days: 3
          if-no-files-found: error

  apply:
    name: Apply (${{ needs.plan.outputs.risk }} risk)
    needs: plan
    if: needs.plan.outputs.risk == 'low' || needs.plan.outputs.risk == 'high'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ needs.plan.outputs.risk == 'low' && 'infra-auto' || 'infra-approval' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-terraform
        with:
          workload-identity-provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service-account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan
          path: terraform

      # Locks state. Terraform refuses the plan if state changed since it
      # was made (e.g. while waiting for approval): re-run the workflow.
      - name: terraform apply
        working-directory: terraform
        run: terraform apply -input=false -no-color plan.tfplan
