version: 2

models:

  - name: dim_series
    description: >
      Dimension containing economic series available
      in the Chile Financial Analytics Platform.

    columns:

      - name: series_key
        tests:
          - unique
          - not_null

      - name: series_code
        tests:
          - unique
          - not_null


  - name: fact_economic_observation
    description: >
      Economic observations by series and observation date.

    columns:

      - name: series_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_series')
                field: series_key

      - name: observation_date
        tests:
          - not_null

      - name: value
        tests:
          - not_null
    
    data_tests:

      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - series_key
            - observation_date