version: 2

sources:

  - name: bcch
    database: chile-financial-analytics 
    schema: raw_bcch

    config:
      meta:

        # Freshness by update cadence, referenced by the observations__*
        # entries below. ingested_at only moves when a row is inserted or
        # its value changes, so these measure new data landing, not
        # pipeline runs. Thresholds are calendar hours; BCCh publishes
        # on business days.
        freshness_by_cadence:

          # New value every business day, published the evening before
          # (Friday's run lands Monday's). warn: a long weekend (Friday
          # load, Monday holiday). error: a break longer than that;
          # Fiestas Patrias (5+ days) still trips it.
          daily: &daily_freshness
            warn_after: {count: 72, period: hour}
            error_after: {count: 120, period: hour}

          # One release a month (IPC ~8th of M+1, IMACEC ~1st of M+2),
          # plus revisions in between. warn: a release a few days late.
          # error: a release missed.
          monthly: &monthly_freshness
            warn_after: {count: 35, period: day}
            error_after: {count: 45, period: day}

    tables:

      - name: observations
        description: >
          One row per BCCh series per date, as returned by the API.
          Loaded by src/pipelines/bcch.py with a MERGE that skips
          unchanged rows.

        # No table-level freshness: the daily series land every business
        # day, so max(ingested_at) would hide a monthly series that
        # stopped loading. See the per-series entries below.

        columns:

          - name: series_code
            tests:
              - not_null

          - name: observation_date
            tests:
              - not_null

          - name: value
            description: Null on weekends/holidays for daily series.

          - name: extracted_at
            description: When the run that last changed the row fetched it from BCCh.
            tests:
              - not_null

          - name: ingested_at
            description: >
              When the row was last written to the warehouse: inserted,
              or its value changed. Rows loaded before the column existed
              were backfilled from extracted_at.
            tests:
              - not_null

          - name: ingestion_run_id
            description: >
              The ingestion run that last wrote the row (inserted it or
              changed its value). Rows loaded before the column existed
              carry their original run id, rebuilt from extracted_at.
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('monitoring', 'ingestion_runs')
                    field: run_id

        data_tests:

          # Grain: one row per series per date
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns:
                  - series_code
                  - observation_date

      # Freshness monitors: raw_bcch.observations filtered to one series,
      # each against its cadence. Models read `observations`, not these.
      # A new series in config/bcch_series.yml needs an entry here.

      - name: observations__usd_clp
        identifier: observations
        description: Freshness of USD/CLP (F073.TCO.PRE.Z.D), daily.
        config:
          loaded_at_field: ingested_at
          freshness:
            <<: *daily_freshness
            filter: "series_code = 'F073.TCO.PRE.Z.D'"

      - name: observations__tpm
        identifier: observations
        description: Freshness of TPM (F022.TPM.TIN.D001.NO.Z.D), daily.
        config:
          loaded_at_field: ingested_at
          freshness:
            <<: *daily_freshness
            filter: "series_code = 'F022.TPM.TIN.D001.NO.Z.D'"

      - name: observations__imacec
        identifier: observations
        description: Freshness of IMACEC (F032.IMC.IND.Z.Z.EP18.Z.Z.0.M), monthly.
        config:
          loaded_at_field: ingested_at
          freshness:
            <<: *monthly_freshness
            filter: "series_code = 'F032.IMC.IND.Z.Z.EP18.Z.Z.0.M'"

      - name: observations__ipc_monthly_variation
        identifier: observations
        description: Freshness of IPC Monthly Variation (G073.IPC.VAR.2023.M), monthly.
        config:
          loaded_at_field: ingested_at
          freshness:
            <<: *monthly_freshness
            filter: "series_code = 'G073.IPC.VAR.2023.M'"

      - name: series
        description: >
          Latest known metadata for one BCCh series. Loaded by
          src/ingestion/series.py from the BCCh SearchSeries catalog
          merged with curated metadata (metadata/bcch/series.yml).

        columns:

          - name: series_code
            description: BCCh series code. Natural key.
            tests:
              - unique
              - not_null

          - name: series_name
            description: Curated display name (e.g. USD/CLP).
            tests:
              - not_null

          - name: description
            description: Curated description.

          - name: category
            description: Curated category (e.g. Exchange Rate).
            tests:
              - not_null

          - name: frequency
            description: Frequency from the BCCh catalog, lowercased.
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['daily', 'monthly', 'quarterly', 'annual']

          - name: unit
            description: Curated unit (e.g. CLP per USD).
            tests:
              - not_null

          - name: source_title_es
            description: Spanish title as returned by BCCh.

          - name: source_title_en
            description: English title as returned by BCCh.

          - name: first_observation_date
            description: First available observation according to BCCh.

          - name: last_observation_date
            description: Last available observation according to BCCh.

          - name: source_updated_date
            description: Last update date reported by BCCh.

          - name: extraction_date
            tests:
              - not_null

          - name: extracted_at
            tests:
              - not_null

          - name: source
            tests:
              - not_null

          - name: ingestion_run_id
            description: >
              The ingestion run that last wrote the row (inserted it or
              changed its value). Rows loaded before the column existed
              carry their original run id, rebuilt from extracted_at.
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('monitoring', 'ingestion_runs')
                    field: run_id

  - name: monitoring
    database: chile-financial-analytics
    schema: monitoring
    description: >
      Pipeline observability, kept apart from source data and
      independent of Airflow's metadata database.

    tables:

      - name: ingestion_runs
        description: >
          Audit log: one row per ingestion execution (src.ingestion.
          observations or src.ingestion.series), written when it starts
          and completed when it ends, failures included. Raw rows'
          ingestion_run_id points here. Runs that predate the table have
          status unknown and only id and start time.

        columns:

          - name: run_id
            description: >
              Unique per execution: start timestamp plus a random suffix
              (older runs: timestamp only). Also the run summary's file
              name and the run_id BigQuery job label.
            tests:
              - unique
              - not_null

          - name: source
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['bcch']

          - name: started_at
            tests:
              - not_null

          - name: completed_at

          - name: status
            description: >
              running (in progress, or killed before finishing), success,
              failed (some series failed validation or loading), crashed
              (raised before writing its summary), unknown (predates the
              table).
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['running', 'success', 'failed', 'crashed', 'unknown']

          - name: extracted_rows
            description: Rows fetched from BCCh.

          - name: valid_rows
            description: Rows that passed validation (validation accepts or rejects a whole series).

          - name: rejected_rows
            description: Rows that failed validation; kept as raw files, never loaded.

          - name: loaded_rows
            description: Rows written to the warehouse by a committed MERGE.

          - name: error_message
            description: >
              Failed series and why, or the exception of a crashed run.
              Redacted and capped at 1,000 characters; the run summary
              (summary_uri) has the full detail.

          - name: pipeline
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['bcch_ingestion', 'bcch_series_metadata']

          - name: target_table
            description: Raw table the run loads (dataset.table).
            tests:
              - not_null

          - name: rows_changed
            description: Rows the MERGE inserted, updated or deleted (0 when nothing new).

          - name: summary_uri
            description: The run summary JSON in GCS (per-series detail).

          - name: parent_run_id
            description: The src.pipelines.bcch run the step belonged to, if any.

        data_tests:

          # A finished run has an end, after its start
          - dbt_utils.expression_is_true:
              arguments:
                expression: >
                  (status in ('running', 'unknown') and completed_at is null)
                  or (status not in ('running', 'unknown') and completed_at >= started_at)

          # Rows only drop out between stages: extracted ≥ validated ≥ loaded
          - dbt_utils.expression_is_true:
              arguments:
                expression: >
                  valid_rows + rejected_rows <= extracted_rows
                  and loaded_rows <= valid_rows
              config:
                where: "status in ('success', 'failed')"

          # Failures say why; successes don't
          - dbt_utils.expression_is_true:
              arguments:
                expression: >
                  (status in ('failed', 'crashed')) = (error_message is not null)
              config:
                where: "status != 'unknown' and status != 'running'"

          # Error payloads stay small
          - dbt_utils.expression_is_true:
              arguments:
                expression: "length(error_message) <= 1000"
              config:
                where: "error_message is not null"
