name: "chile_financial_analytics"
version: "1.0.0"

profile: "chile_financial_analytics"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

# Correlate BigQuery jobs with dbt invocations and Airflow runs
# (see macros/bcch_query_comment.sql).
query-comment:
  comment: "{{ bcch_query_comment(node) }}"
  job-label: true

clean-targets:
  - "target"
  - "dbt_packages"

models:
  chile_financial_analytics:

    staging:
      +materialized: view

    intermediate:
      +materialized: view

    marts:
      +materialized: table
